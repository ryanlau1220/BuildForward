# Production stack for a single VPS fronted by Nginx Proxy Manager (NPM).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# NPM (running separately) terminates TLS and reaches web/api through its
# existing Docker network. Host ports remain bound to 127.0.0.1 for local checks.
#
# Point NPM at these upstreams on proxy-manager_default:
#
#   Option A (single hostname, same-origin -- recommended):
#     Proxy host  <DOMAIN>  ->  buildforward-web:3000
#     Add a Custom Location in NPM:
#       location  /api        ->  buildforward-api:8000
#       location  /docs       ->  buildforward-api:8000
#       location  /openapi.json -> buildforward-api:8000
#     Set NEXT_PUBLIC_API_URL=https://<DOMAIN>  (same origin, no CORS).
#
# WEB_BIND / API_BIND default to 127.0.0.1.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildforward}
      POSTGRES_USER: ${POSTGRES_USER:-buildforward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildforward} -d ${POSTGRES_DB:-buildforward}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildforward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-buildforward}
      # Public origin(s) allowed to call the API from a browser. For the
      # single-hostname setup this is just your domain. Comma-separate extras.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env.production}
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - buildforward-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time (NEXT_PUBLIC_* is inlined into the bundle).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.production}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - buildforward-web

volumes:
  postgres_data:

networks:
  internal:
  proxy:
    external: true
    name: proxy-manager_default
